name: Build Android APK

# 触发条件: push 到 main/master 分支, 或手动触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build release APK
        working-directory: android_app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback if release fails)
        if: failure()
        working-directory: android_app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-calendar-apk
          path: |
            android_app/app/build/outputs/apk/release/*.apk
            android_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
